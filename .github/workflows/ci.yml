name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable
  COVERAGE_THRESHOLD: 80

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Enforce NSE has no CallKit/PushKit imports
        run: |
          if grep -rE '^import (CallKit|PushKit)' ios/KoheraNotificationService/; then
            echo "::error::Notification Service Extension must not import CallKit or PushKit"
            exit 1
          fi
      - name: Verify vodozemac ref parity (pubspec / Dockerfile / prepare-web.sh)
        run: |
          pubspec_ref=$(grep -A2 'dart-vodozemac.git' pubspec.yaml | grep 'ref:' | head -1 | tr -d ' "' | cut -d: -f2)
          docker_ref=$(grep 'ARG VODOZEMAC_REF=' Dockerfile | cut -d= -f2)
          script_ref=$(grep '^ref=' scripts/prepare-web.sh | cut -d= -f2)
          echo "pubspec=$pubspec_ref docker=$docker_ref script=$script_ref"
          if [ "$docker_ref" != "$script_ref" ]; then
            echo "::error::Dockerfile ($docker_ref) and prepare-web.sh ($script_ref) vodozemac refs differ"
            exit 1
          fi
          case "$docker_ref" in
            "$pubspec_ref"*) ;;
            *) echo "::error::Web WASM ref ($docker_ref) does not match pubspec.yaml override ($pubspec_ref); the flutter_rust_bridge handshake will fail at runtime"; exit 1 ;;
          esac

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test --coverage
      - name: Coverage gate
        run: dart run flutter_ci_guard --skip-format --skip-analyze --skip-tests --min-coverage ${{ env.COVERAGE_THRESHOLD }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  build-linux:
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libmpv-dev
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}

  build-macos:
    needs: [analyze, test]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Disable signing for smoke build
        working-directory: macos
        run: |
          sed -i '' 's/CODE_SIGN_INJECT_BASE_ENTITLEMENTS = NO;/CODE_SIGN_INJECT_BASE_ENTITLEMENTS = NO; CODE_SIGNING_ALLOWED = NO;/' Runner.xcodeproj/project.pbxproj
      - name: Pre-build macOS Pods (force repo update)
        working-directory: macos
        run: |
          flutter precache --macos
          pod install --repo-update
      - run: flutter build macos --release --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}

  build-android:
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}

  build-ios:
    needs: [analyze, test]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Pre-build iOS Pods (force repo update)
        working-directory: ios
        run: |
          flutter precache --ios
          pod install --repo-update
      - run: flutter build ios --no-codesign --release --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}

  build-web:
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build web image (compiles vodozemac WASM from the pinned ref)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
