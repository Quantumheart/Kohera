name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Verify tag is on master
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag must point to a commit on master"
            exit 1
          fi

  # Hide the release-please-created release as a draft the moment the tag
  # pushes, so users never see a "released" version that has no artifacts yet.
  # publish-release un-drafts it only after every platform build + TestFlight
  # succeed; a failed deploy leaves it hidden as a draft.
  hide-release:
    needs: verify-tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  build-linux:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libmpv-dev
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}
      - name: Strip debug symbols
        run: strip build/linux/x64/release/bundle/kohera
      - name: Archive build
        run: tar -czf kohera-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: Generate checksum
        run: sha256sum kohera-linux-x64.tar.gz > kohera-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: |
            kohera-linux-x64.tar.gz
            kohera-linux-x64.tar.gz.sha256

  build-windows:
    needs: verify-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: flutter pub get
      - run: flutter build windows --release --split-debug-info=build/windows/debug-info --obfuscate --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}
      - name: Build installer
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          iscc /DAppVersion=$version windows\packaging\inno_setup.iss
      - name: Generate checksum
        run: Get-FileHash build\windows\installer\kohera-windows-x64-setup.exe -Algorithm SHA256 | Format-List > build\windows\installer\kohera-windows-x64-setup.exe.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            build/windows/installer/kohera-windows-x64-setup.exe
            build/windows/installer/kohera-windows-x64-setup.exe.sha256

  build-macos:
    needs: verify-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Cache CocoaPods and SPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            macos/Pods
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/org.swift.swiftpm
          key: pods-macos-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: pods-macos-
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
      - name: Setup fastlane
        env:
          APPSTORE_CONNECT_API_KEY: ${{ secrets.APPSTORE_CONNECT_API_KEY }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
        run: |
          gem install fastlane --no-document
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APPSTORE_CONNECT_API_KEY" | base64 --decode \
            -o ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8
      - id: kc_pass
        run: |
          pw="$(openssl rand -hex 32)"
          echo "::add-mask::$pw"
          echo "password=$pw" >> "$GITHUB_OUTPUT"
      - name: Sync signing (Developer ID via match)
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_KEY_FILEPATH: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_KEY_ID }}.p8
          MATCH_KEYCHAIN_PASSWORD: ${{ steps.kc_pass.outputs.password }}
        run: fastlane sync_signing_macos
      - run: flutter pub get
      - name: Repair vodozemac framework layout
        run: |
          FW="$(find -L macos/Flutter/ephemeral/Packages/.packages -type d -path '*/flutter_vodozemac-*/flutter_vodozemac.xcframework/macos-arm64_x86_64/flutter_vodozemac.framework' | head -n1)"
          echo "Resolved framework: ${FW:-<none>}"
          if [ -n "$FW" ] && [ -d "$FW/Versions/A" ]; then
            echo "Rebuilding canonical versioned framework layout in $FW"
            rm -rf "$FW/Versions/Current"
            ln -s A "$FW/Versions/Current"
            for e in flutter_vodozemac Headers Modules Resources; do
              rm -rf "$FW/$e"
              ln -s "Versions/Current/$e" "$FW/$e"
            done
            echo "=== $FW ==="
            ls -la "$FW"
            echo "=== Versions ==="
            ls -la "$FW/Versions"
          else
            echo "::error::vodozemac framework not found or missing Versions/A (FW=${FW:-<empty>})"
            ls -la "macos/Flutter/ephemeral/Packages/.packages" 2>/dev/null || true
            exit 1
          fi
      - name: Build macOS
        run: flutter build macos --release --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}
      - name: Notarize and staple
        env:
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          APP="build/macos/Build/Products/Release/kohera.app"
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"
          ditto -c -k --keepParent "$APP" kohera-macos-universal.zip
          SUBMIT_OUT=$(xcrun notarytool submit kohera-macos-universal.zip \
            --key "$KEY_FILE" \
            --key-id "$APPSTORE_CONNECT_KEY_ID" \
            --issuer "$APPSTORE_CONNECT_ISSUER_ID" \
            --wait 2>&1 | tee /dev/stderr)
          SUBMIT_ID=$(echo "$SUBMIT_OUT" | awk '/^[[:space:]]+id:/{print $2; exit}')
          STATUS=$(echo "$SUBMIT_OUT" | awk '/^[[:space:]]+status:/{s=$2} END{print s}')
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization status: $STATUS (id: $SUBMIT_ID). Fetching log:"
            xcrun notarytool log "$SUBMIT_ID" \
              --key "$KEY_FILE" \
              --key-id "$APPSTORE_CONNECT_KEY_ID" \
              --issuer "$APPSTORE_CONNECT_ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple "$APP"
          codesign --verify --verbose=4 "$APP"
      - name: Archive stapled build
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent kohera.app ../../../../../kohera-macos-universal.zip
      - name: Generate checksum
        run: shasum -a 256 kohera-macos-universal.zip > kohera-macos-universal.zip.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release
          path: |
            kohera-macos-universal.zip
            kohera-macos-universal.zip.sha256

  build-ios:
    needs: verify-tag
    runs-on: macos-26
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Cache CocoaPods and SPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/org.swift.swiftpm
          key: pods-ios-v2-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-ios-
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
      - name: Setup fastlane
        env:
          APPSTORE_CONNECT_API_KEY: ${{ secrets.APPSTORE_CONNECT_API_KEY }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
        run: |
          gem install fastlane --no-document
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APPSTORE_CONNECT_API_KEY" | base64 --decode \
            -o ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8
      - id: kc_pass
        run: |
          pw="$(openssl rand -hex 32)"
          echo "::add-mask::$pw"
          echo "password=$pw" >> "$GITHUB_OUTPUT"
      - name: Sync signing (cert + profiles via match)
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_KEY_FILEPATH: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_KEY_ID }}.p8
          # Dedicated keychain password generated per-run so match can set the
          # key partition list and let codesign access the private key without
          # a UI prompt (the runner is headless). The keychain is ephemeral.
          MATCH_KEYCHAIN_PASSWORD: ${{ steps.kc_pass.outputs.password }}
        run: fastlane sync_signing
      - run: flutter pub get
      - run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --build-number=${{ github.run_number }} --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}
      - name: Upload to TestFlight
        env:
          APPSTORE_CONNECT_API_KEY: ${{ secrets.APPSTORE_CONNECT_API_KEY }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APPSTORE_CONNECT_API_KEY" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8
          xcrun altool --upload-app \
            -f build/ios/ipa/kohera.ipa \
            -t ios \
            --apiKey "$APPSTORE_CONNECT_KEY_ID" \
            --apiIssuer "$APPSTORE_CONNECT_ISSUER_ID"
      - name: Stage IPA and generate checksum
        run: |
          cp build/ios/ipa/kohera.ipa kohera-ios-arm64.ipa
          shasum -a 256 kohera-ios-arm64.ipa > kohera-ios-arm64.ipa.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-release
          path: |
            kohera-ios-arm64.ipa
            kohera-ios-arm64.ipa.sha256

  build-android:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Install signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/kohera-release.jks"
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64 --build-number=${{ github.run_number }} --obfuscate --split-debug-info=build/android/debug-info --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk kohera-android-arm64.apk
      - name: Verify APK is arm64-only
        run: |
          if unzip -l kohera-android-arm64.apk | grep -qE 'lib/(x86_64|x86|armeabi-v7a)/'; then
            echo "::error::APK contains native libraries for non-arm64 ABIs"
            unzip -l kohera-android-arm64.apk | grep 'lib/'
            exit 1
          fi
          size_mb=$(( $(stat -c%s kohera-android-arm64.apk) / 1024 / 1024 ))
          echo "arm64 APK size: ${size_mb} MB"
          if [ "$size_mb" -gt 70 ]; then
            echo "::error::APK is ${size_mb} MB, exceeds 70 MB budget"
            exit 1
          fi
      - name: Generate checksum
        run: sha256sum kohera-android-arm64.apk > kohera-android-arm64.apk.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release
          path: |
            kohera-android-arm64.apk
            kohera-android-arm64.apk.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-debug-info
          path: build/android/debug-info
      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/kohera-release.jks" android/key.properties

  publish-release:
    needs: [build-linux, build-windows, build-macos, build-ios, build-android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the drafted release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release
      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            kohera-linux-x64.tar.gz
            kohera-linux-x64.tar.gz.sha256
            kohera-windows-x64-setup.exe
            kohera-windows-x64-setup.exe.sha256
            kohera-macos-universal.zip
            kohera-macos-universal.zip.sha256
            kohera-ios-arm64.ipa
            kohera-ios-arm64.ipa.sha256
            kohera-android-arm64.apk
            kohera-android-arm64.apk.sha256
          generate_release_notes: false
          append_body: false
          draft: false
